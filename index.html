<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Энергетический календарь</title>

<style>
body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffd6d6,#ffe6cc);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
background:white;
width:90%;
max-width:400px;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h1{
font-size:28px;
margin-bottom:15px;
}

p{
font-size:16px;
line-height:1.6;
color:#666;
margin-bottom:30px;
}

.button{
display:block;
text-decoration:none;
padding:18px;
border-radius:15px;
font-size:18px;
font-weight:bold;
background:#ff8fa3;
color:white;
}

.button:active{
transform:scale(0.98);
}
</style>

</head>

<body>

<div class="card">

<h1>Энергетический календарь</h1>

<p>
Добавьте календарь в календарь и получайте прогнозы автоматически каждый день.
</p>

<a class="button"
href="https://raw.githubusercontent.com/ol2010naumova-pixel/calendar/main/astro-calendar.ics">

Добавить календарь

</a>

</div>

</body>
</html>
